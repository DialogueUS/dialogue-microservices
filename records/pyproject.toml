[project]
name = "pr-records"
version = "0.1.0"
description = "Public-records pipeline: orchestrator + scraper / sender / receiver consumers"
requires-python = ">=3.12"
dependencies = [
    "harvest-core",
]

[project.scripts]
pr-records = "public_records.cli:main"

[tool.uv.sources]
harvest-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/public_records"]
