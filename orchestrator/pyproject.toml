[project]
name = "harvest-orchestrator"
version = "0.1.0"
description = "Orchestrator service: seed, generate, dispatch, reconcile"
requires-python = ">=3.12"
dependencies = [
    "harvest-core",
]

[project.scripts]
harvest-orchestrator = "harvest_orchestrator.cli:main"

[tool.uv.sources]
harvest-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_orchestrator"]
