[project]
name = "harvest-core"
version = "0.1.0"
description = "Shared domain models, config, ports, fakes, and real adapters"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",  # the postgresql+psycopg2:// driver every DATABASE_URL names
    "boto3>=1.35",
    "redis>=5",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_core"]
