[project]
name = "harvest-harvester"
version = "0.1.0"
description = "Harvester service: sweep / code / fetch workers"
requires-python = ">=3.12"
dependencies = [
    "harvest-core",
    "pypdf>=5",
    "Scrapy>=2.11",
    "scrapy-playwright>=0.0.40",
]

[project.scripts]
harvest-harvester = "harvest_harvester.cli:main"

[tool.uv.sources]
harvest-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvest_harvester"]
